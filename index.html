<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#F3F3FE" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Actora" />
    <title>Actora</title>
    <script>
      // A tapped reminder or message opens the site root; if the user lives in the 3D app,
      // carry it there (src/push/push.ts remembers which app was used last).
      try {
        var app = localStorage.getItem('actora.app')
        if (
          location.pathname === '/' &&
          app &&
          app !== '/' &&
          /^\/[a-z0-9]+\/$/.test(app) &&
          /[?&](notification|dm)=/.test(location.search)
        )
          location.replace(app + location.search)
      } catch (e) {}
    </script>
    <!-- First paint in Satoshi, not a system-font flash while it loads. -->
    <link rel="preload" href="/fonts/Satoshi-Variable.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
